name: Build OurSigner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet publish src/OurSigner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OurSigner-Windows
          path: build/OurSigner.exe